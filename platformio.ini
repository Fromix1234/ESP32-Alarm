; ESP32 DevKit + TFT ST7789 240x320
; Сборка:  pio run
; Прошивка: pio run -t upload
; Монитор:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Wi-Fi + веб-сервер + JSON занимают больше стандартного слота 1.31 МБ
board_build.partitions = huge_app.csv

monitor_speed = 115200
upload_speed = 230400

; Авто-сброс на этой плате не работает, поэтому перед заливкой:
; зажать BOOT -> коротко нажать EN -> BOOT не отпускать -> upload.
upload_flags =
    --before=no_reset

lib_deps =
    adafruit/Adafruit ST7735 and ST7789 Library
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -DCORE_DEBUG_LEVEL=0

; основной скетч не должен компилировать калибровку
build_src_filter = +<main.cpp> -<calib.cpp>

monitor_filters =
    esp32_exception_decoder

[env:calib]
extends = env:esp32dev
build_src_filter = +<calib.cpp> -<main.cpp>
